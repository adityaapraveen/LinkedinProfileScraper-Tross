name: CI

on:
  push:
    branches:
      - main
      - feat/linkedin-protocol-adapter
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run mocked tests
        run: npm test
        env:
          LOG_LEVEL: silent

      - name: Replay sanitized protocol fixtures
        run: npm run protocol:replay

      - name: Build application
        run: npm run build

      - name: Build production container
        run: docker build --tag tross-linkedin-api:ci .
